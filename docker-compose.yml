services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: mnm
      POSTGRES_PASSWORD: mnm
      POSTGRES_DB: mnm
    ports:
      - "5433:5432"
    volumes:
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mnm"]
      interval: 2s
      timeout: 3s
      retries: 15
